[project]
name = "agentforge-server"
version = "0.1.0"
description = "AgentForge FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "pydantic-settings",
]

[dependency-groups]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
